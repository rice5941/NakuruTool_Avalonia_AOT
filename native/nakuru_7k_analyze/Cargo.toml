[package]
name = "nakuru_7k_analyze"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false
description = "C FFI adapter around Mania Tracker (Prism / LN skill / dan-calc) for NakuruTool's 7K chart analysis"

[lib]
name = "analyze_7k"
crate-type = ["cdylib", "rlib"]

# All calculation crates come from the same pinned Mania Tracker (mania-hub) commit.
# The adapter adds no rating formulas except the genre tendency; see UPSTREAM.md.
[dependencies]
prism = { git = "https://github.com/aleju03/mania-hub", rev = "1339369851234d6ed928aa1bd8149a4b558378e6" }
ln-skill = { git = "https://github.com/aleju03/mania-hub", rev = "1339369851234d6ed928aa1bd8149a4b558378e6" }
dan-core = { git = "https://github.com/aleju03/mania-hub", rev = "1339369851234d6ed928aa1bd8149a4b558378e6" }
# No MinaCalc: leoblack-ett is replaced below, so no feature is needed.
dan-calc = { git = "https://github.com/aleju03/mania-hub", rev = "1339369851234d6ed928aa1bd8149a4b558378e6", default-features = false }
serde_json = "1"

[build-dependencies]
csbindgen = "1.9"

[patch."https://github.com/aleju03/mania-hub"]
# Stable hitobject time sort (LeoBlack 5fac939); see vendor/leoblack-parser/UPSTREAM.md.
leoblack-parser = { path = "vendor/leoblack-parser" }
# MinaCalc (WebAssembly + wasmtime) removed: 7K charts never reach it; see UPSTREAM.md.
leoblack-ett = { path = "vendor/leoblack-ett" }

[profile.release]
lto = "thin"
codegen-units = 4
